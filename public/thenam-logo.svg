<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" width="100%" height="100%">
  <defs>
    <!-- Background filter for black background -->
    <linearGradient id="thenamTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1240AB" />
      <stop offset="18%" stop-color="#1852C4" />
      <stop offset="38%" stop-color="#0284C7" />
      <stop offset="55%" stop-color="#00A896" />
      <stop offset="78%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Metallic Spine Gradient -->
    <linearGradient id="spineChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="75%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Right Upper Leaf Green to Golden-Yellow Gradient -->
    <linearGradient id="upperLeafGrad" x1="15%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="30%" stop-color="#65A30D" />
      <stop offset="65%" stop-color="#EAB308" />
      <stop offset="90%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>

    <!-- Right Upper Leaf Highlight Overlay -->
    <linearGradient id="upperLeafHighlight" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#A3E635" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#84CC16" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#FACC15" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0.3" />
    </linearGradient>

    <!-- Right Lower Leaf Amber Gradient -->
    <linearGradient id="lowerLeafGrad" x1="10%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="35%" stop-color="#EAB308" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Left Cyber Leaf Blue/Teal Gradient -->
    <linearGradient id="cyberLeafBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="35%" stop-color="#0369A1" />
      <stop offset="70%" stop-color="#0C4A6E" />
      <stop offset="100%" stop-color="#041F38" />
    </linearGradient>

    <linearGradient id="cyberFacetA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="cyberFacetB" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#082F49" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="horizonGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <!-- Base Floor Reflection Glow -->
    <radialGradient id="floorReflection" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#84CC16" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep pitch-black canvas -->
  <rect width="720" height="800" fill="#000000" />

  <!-- === HORIZON FLOOR GLOW REFLECTION === -->
  <ellipse cx="360" cy="482" rx="190" ry="6" fill="url(#floorReflection)" filter="url(#horizonGlowFilter)" />
  <path d="M 230 482 Q 360 484 490 482" stroke="#FBBF24" stroke-width="1.8" stroke-opacity="0.7" fill="none" />
  <path d="M 270 482 Q 360 483 450 482" stroke="#38BDF8" stroke-width="2.2" stroke-opacity="0.9" fill="none" filter="url(#cyanGlow)" />

  <!-- ================= LEAF EMBLEM ================= -->
  <g transform="translate(0, 0)">
    <!-- 1. RIGHT UPPER LEAF (Green to Golden-Yellow with Veins) -->
    <path
      d="M 378 85 C 415 105 500 165 540 245 C 568 300 562 342 525 378 C 475 412 405 415 340 408 C 375 365 415 305 420 225 C 422 165 400 115 378 85 Z"
      fill="url(#upperLeafGrad)"
    />
    <path
      d="M 378 85 C 428 120 515 185 542 270 C 555 318 528 360 485 380 C 435 345 422 265 418 205 C 412 145 395 102 378 85 Z"
      fill="url(#upperLeafHighlight)"
      opacity="0.9"
    />

    <!-- Leaf Veins on Upper Right Leaf -->
    <g stroke="#FDE047" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8">
      <path d="M 408 160 C 438 155 475 162 500 180" />
      <path d="M 414 200 C 452 198 495 210 522 235" />
      <path d="M 415 245 C 458 248 502 265 530 300" />
      <path d="M 410 290 C 448 300 488 325 512 350" />
      <path d="M 395 335 C 425 348 458 368 478 380" />
    </g>

    <!-- 2. RIGHT LOWER LEAF (Warm Amber Overlap) -->
    <path
      d="M 405 300 C 460 325 525 368 518 420 C 510 455 462 472 398 455 C 348 440 315 415 285 408 C 335 402 375 362 405 300 Z"
      fill="url(#lowerLeafGrad)"
    />
    <!-- Veins on Lower Right Leaf -->
    <g stroke="#FEF08A" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75">
      <path d="M 360 405 C 395 420 440 435 475 440" />
      <path d="M 385 385 C 425 400 462 408 492 410" />
    </g>

    <!-- 3. LEFT CYBER LEAF (Digital Neural Lattice) -->
    <!-- Base smooth blue teardrop silhouette -->
    <path
      d="M 378 85 C 322 90 238 145 192 230 C 158 295 162 360 205 405 C 252 450 315 455 375 415 C 332 350 328 240 378 85 Z"
      fill="url(#cyberLeafBase)"
    />

    <!-- 3D Geometric Facets -->
    <polygon points="378,85 300,165 262,225 330,210" fill="url(#cyberFacetA)" opacity="0.7" />
    <polygon points="300,165 192,230 210,310 272,275" fill="url(#cyberFacetB)" opacity="0.8" />
    <polygon points="262,225 330,210 340,310 272,275" fill="url(#cyberFacetA)" opacity="0.6" />
    <polygon points="210,310 205,405 285,380 272,275" fill="url(#cyberFacetB)" opacity="0.85" />
    <polygon points="272,275 340,310 335,395 285,380" fill="url(#cyberFacetA)" opacity="0.7" />
    <polygon points="285,380 335,395 375,415 320,435" fill="url(#cyberFacetB)" opacity="0.75" />

    <!-- Constellation Neural Network Lines -->
    <g stroke="#00E5FF" stroke-width="2.4" stroke-opacity="0.9" stroke-linecap="round" filter="url(#cyanGlow)">
      <line x1="300" y1="165" x2="262" y2="225" />
      <line x1="262" y1="225" x2="210" y2="310" />
      <line x1="262" y1="225" x2="330" y2="210" />
      <line x1="330" y1="210" x2="340" y2="310" />
      <line x1="272" y1="275" x2="340" y2="310" />
      <line x1="272" y1="275" x2="285" y2="380" />
      <line x1="210" y1="310" x2="272" y2="275" />
      <line x1="210" y1="310" x2="225" y2="385" />
      <line x1="225" y1="385" x2="285" y2="380" />
      <line x1="340" y1="310" x2="320" y2="400" />
      <line x1="285" y1="380" x2="320" y2="400" />
    </g>

    <!-- Glowing Node Dots (Black Core + Luminous Cyan Ring) -->
    <g filter="url(#cyanGlow)">
      <!-- Node 1 -->
      <circle cx="300" cy="165" r="7.5" fill="#00E5FF" />
      <circle cx="300" cy="165" r="3.8" fill="#021B2F" />

      <!-- Node 2 -->
      <circle cx="262" cy="225" r="8.5" fill="#38BDF8" />
      <circle cx="262" cy="225" r="4.2" fill="#021B2F" />

      <!-- Node 3 -->
      <circle cx="330" cy="210" r="7.5" fill="#00E5FF" />
      <circle cx="330" cy="210" r="3.8" fill="#021B2F" />

      <!-- Node 4 -->
      <circle cx="210" cy="310" r="8.5" fill="#00E5FF" />
      <circle cx="210" cy="310" r="4.2" fill="#021B2F" />

      <!-- Node 5 -->
      <circle cx="272" cy="275" r="9" fill="#38BDF8" />
      <circle cx="272" cy="275" r="4.8" fill="#021B2F" />

      <!-- Node 6 -->
      <circle cx="340" cy="310" r="8.5" fill="#00E5FF" />
      <circle cx="340" cy="310" r="4.2" fill="#021B2F" />

      <!-- Node 7 -->
      <circle cx="285" cy="380" r="7.5" fill="#38BDF8" />
      <circle cx="285" cy="380" r="3.8" fill="#021B2F" />

      <!-- Node 8 -->
      <circle cx="225" cy="385" r="6.5" fill="#00E5FF" />
      <circle cx="225" cy="385" r="3.2" fill="#021B2F" />
    </g>

    <!-- 4. CENTRAL METALLIC CHROME SILVER SPINE -->
    <path
      d="M 378 85 C 384 130 380 180 375 230 C 368 290 355 350 318 418 C 295 450 262 475 220 488 C 258 480 310 455 348 422 C 386 378 405 305 410 230 C 412 170 395 120 378 85 Z"
      fill="url(#spineChrome)"
      filter="url(#cyanGlow)"
    />
    <!-- Specular Highlight Curve on Spine -->
    <path
      d="M 378 88 C 386 140 382 210 374 270 C 364 330 340 395 285 452"
      stroke="#FFFFFF"
      stroke-width="2.6"
      stroke-linecap="round"
      fill="none"
      opacity="0.95"
    />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- "THENAM" in bold capital letters with exact gradient -->
  <text
    x="360"
    y="615"
    font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', -apple-system, sans-serif"
    font-size="94"
    font-weight="900"
    letter-spacing="5"
    text-anchor="middle"
    fill="url(#thenamTextGradient)"
  >THENAM</text>

  <!-- "SOFTWARE SOLUTIONS" in tracked silver capitals -->
  <text
    x="360"
    y="672"
    font-family="'Plus Jakarta Sans', 'Outfit', -apple-system, sans-serif"
    font-size="28"
    font-weight="600"
    letter-spacing="14"
    text-anchor="middle"
    fill="#CBD5E1"
  >SOFTWARE SOLUTIONS</text>
</svg>
