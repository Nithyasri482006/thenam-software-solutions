<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="100%" height="100%">
  <defs>
    <!-- Background glow filters -->
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients for Left Cyber Leaf -->
    <linearGradient id="cyberLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="75%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="cyberFacet1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cyberFacet2" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#082F49" stop-opacity="0.9" />
    </linearGradient>

    <!-- Linear Gradients for Right Organic Leaves -->
    <linearGradient id="greenGoldGrad1" x1="0%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="35%" stop-color="#65A30D" />
      <stop offset="70%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="greenGoldGrad2" x1="10%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="45%" stop-color="#84CC16" />
      <stop offset="85%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="0.4" />
    </linearGradient>

    <!-- Central Silver Metallic Spine Gradient -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="30%" stop-color="#CBD5E1" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Base Glow Horizon Gradient -->
    <radialGradient id="baseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.7" />
      <stop offset="30%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#84CC16" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Wordmark THENAM Gradient -->
    <linearGradient id="thenamTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="22%" stop-color="#2563EB" />
      <stop offset="48%" stop-color="#00B9C7" />
      <stop offset="75%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Base subtle illumination beneath the leaf emblem -->
    <ellipse cx="400" cy="405" rx="220" ry="8" fill="url(#baseGlow)" filter="url(#soft-glow)" />
    <path d="M 280 405 Q 400 408 520 405" stroke="#FBBF24" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow-teal)" fill="none" />
    <path d="M 330 405 Q 400 407 470 405" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8" fill="none" />

    <!-- === RIGHT ORGANIC LEAF 1 (Main Upper/Middle) === -->
    <!-- Base leaf body with rich green-gold gradient -->
    <path d="M 440 85 C 470 100 550 160 595 240 C 625 295 620 340 580 375 C 530 410 460 415 385 410 C 420 370 465 310 470 230 C 472 170 455 120 440 85 Z"
          fill="url(#greenGoldGrad1)" />

    <!-- Subtle inner shadow/highlight layers for 3D leaf volume -->
    <path d="M 440 85 C 490 120 575 185 600 270 C 615 320 585 365 540 385 C 485 350 470 270 465 210 C 460 150 445 105 440 85 Z"
          fill="url(#greenGoldGrad2)" opacity="0.85" />

    <!-- Leaf Veins on Right Upper Leaf -->
    <g stroke="url(#veinGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M 462 160 C 490 155 525 162 550 180" />
      <path d="M 468 200 C 505 198 545 210 575 235" />
      <path d="M 470 245 C 510 248 555 265 585 300" />
      <path d="M 465 290 C 500 300 540 325 565 350" />
      <path d="M 450 335 C 478 348 510 368 530 380" />
    </g>

    <!-- === RIGHT SECONDARY LEAF (Lower overlapping segment) === -->
    <path d="M 455 300 C 515 325 585 370 575 425 C 565 460 515 480 445 460 C 390 445 355 420 320 410 C 375 405 420 365 455 300 Z"
          fill="url(#greenGoldGrad1)" />
    <!-- Secondary leaf vein segment -->
    <g stroke="url(#veinGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8">
      <path d="M 410 405 C 445 420 490 435 525 440" />
      <path d="M 435 385 C 475 400 515 410 545 412" />
    </g>

    <!-- === LEFT CYBER LEAF (Digital / Neural Network) === -->
    <!-- Base dark blue cyan leaf shell -->
    <path d="M 440 85 C 380 90 290 145 240 230 C 205 295 210 360 255 405 C 305 450 370 455 435 415 C 390 350 385 240 440 85 Z"
          fill="url(#cyberLeafGrad)" />

    <!-- 3D Polyhedral Facet Panels for cyber-tech aesthetic -->
    <polygon points="440,85 355,165 315,225 385,210" fill="url(#cyberFacet1)" opacity="0.6" />
    <polygon points="355,165 240,230 260,310 325,275" fill="url(#cyberFacet2)" opacity="0.75" />
    <polygon points="315,225 385,210 395,310 325,275" fill="url(#cyberFacet1)" opacity="0.5" />
    <polygon points="260,310 255,405 340,380 325,275" fill="url(#cyberFacet2)" opacity="0.8" />
    <polygon points="325,275 395,310 390,395 340,380" fill="url(#cyberFacet1)" opacity="0.65" />
    <polygon points="340,380 390,395 435,415 375,435" fill="url(#cyberFacet2)" opacity="0.7" />

    <!-- Connected Cyber / Neural Network Constellation Lines -->
    <g stroke="#00E5FF" stroke-width="2" stroke-opacity="0.85" stroke-linecap="round" filter="url(#node-glow)">
      <line x1="355" y1="165" x2="315" y2="225" />
      <line x1="315" y1="225" x2="260" y2="310" />
      <line x1="315" y1="225" x2="385" y2="210" />
      <line x1="385" y1="210" x2="395" y2="310" />
      <line x1="325" y1="275" x2="395" y2="310" />
      <line x1="325" y1="275" x2="340" y2="380" />
      <line x1="260" y1="310" x2="325" y2="275" />
      <line x1="260" y1="310" x2="275" y2="385" />
      <line x1="275" y1="385" x2="340" y2="380" />
      <line x1="395" y1="310" x2="375" y2="400" />
      <line x1="340" y1="380" x2="375" y2="400" />
    </g>

    <!-- Glowing Node Dots (Black Core + Cyan Halo) -->
    <g filter="url(#node-glow)">
      <!-- Node 1 -->
      <circle cx="355" cy="165" r="7" fill="#00E5FF" />
      <circle cx="355" cy="165" r="3.5" fill="#031525" />

      <!-- Node 2 -->
      <circle cx="315" cy="225" r="8" fill="#38BDF8" />
      <circle cx="315" cy="225" r="4" fill="#031525" />

      <!-- Node 3 -->
      <circle cx="385" cy="210" r="7" fill="#00E5FF" />
      <circle cx="385" cy="210" r="3.5" fill="#031525" />

      <!-- Node 4 -->
      <circle cx="260" cy="310" r="8" fill="#00E5FF" />
      <circle cx="260" cy="310" r="4" fill="#031525" />

      <!-- Node 5 -->
      <circle cx="325" cy="275" r="8.5" fill="#38BDF8" />
      <circle cx="325" cy="275" r="4.5" fill="#031525" />

      <!-- Node 6 -->
      <circle cx="395" cy="310" r="8" fill="#00E5FF" />
      <circle cx="395" cy="310" r="4" fill="#031525" />

      <!-- Node 7 -->
      <circle cx="340" cy="380" r="7" fill="#38BDF8" />
      <circle cx="340" cy="380" r="3.5" fill="#031525" />

      <!-- Node 8 -->
      <circle cx="275" cy="385" r="6" fill="#00E5FF" />
      <circle cx="275" cy="385" r="3" fill="#031525" />
    </g>

    <!-- === CENTRAL METALLIC SILVER SPINE === -->
    <path d="M 440 85 C 445 130 440 180 435 230 C 428 290 415 350 375 420 C 350 455 315 480 270 495 C 310 485 365 460 405 425 C 445 380 465 305 470 230 C 472 170 455 120 440 85 Z"
          fill="url(#spineGrad)" filter="url(#node-glow)" />

    <!-- Highlight core line on spine -->
    <path d="M 440 88 C 448 140 445 210 436 270 C 426 330 400 395 340 455"
          stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- === TYPOGRAPHY === -->
    <!-- "THENAM" in Bold Modern Sans-Serif with continuous gradient -->
    <text x="400" y="560"
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Outfit', sans-serif"
          font-size="94"
          font-weight="900"
          letter-spacing="4"
          text-anchor="middle"
          fill="url(#thenamTextGrad)">THENAM</text>

    <!-- "SOFTWARE SOLUTIONS" in tracked uppercase silver -->
    <text x="400" y="618"
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif"
          font-size="28"
          font-weight="600"
          letter-spacing="14"
          text-anchor="middle"
          fill="#CBD5E1">SOFTWARE SOLUTIONS</text>
  </g>
</svg>
